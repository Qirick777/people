name: sim

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: 테스트
        run: dotnet test sim/People.Sim.sln -c Release
      - name: 벤치마크 (기록용)
        run: dotnet run -c Release --project sim/People.Sim.Cli -- bench --people 50000 --days 240
